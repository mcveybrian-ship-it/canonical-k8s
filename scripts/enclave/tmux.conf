# Enclave operator tmux config. Installed to /etc/tmux.conf so every account gets it.
#
# tmux reads /etc/tmux.conf first, then ~/.tmux.conf - so a user can still override any of
# this without editing a file the scripts manage.
#
# Deployed by:
#   03-host-services.sh tmux     bare-metal hosts
#   03-compose-vm.sh             every VM, via cloud-init write_files

# Mouse: click panes/windows, drag borders, scroll with the wheel.
#
# NOTE for SecureCRT/PuTTY users: with mouse on, dragging selects into TMUX's buffer, not the
# terminal's. To select for your LOCAL clipboard, hold SHIFT while dragging. Worth knowing
# before it surprises you halfway through pasting a command block.
set -g mouse on

# Ctrl+a instead of Ctrl+b - easier reach, and matches screen.
# Ctrl+a is also bash's beginning-of-line, so that becomes Ctrl+a Ctrl+a via send-prefix.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Splits that show which direction they go, opening in the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Alt+arrows to move between panes, no prefix needed
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift+arrows to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Windows numbered from 1, renumber when one closes
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Scrollback worth having. These scripts produce a lot of output - the mirror restore alone
# emitted 9 MB before progress output was gated on a tty.
set -g history-limit 50000

# Vim-style selection in copy mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Copy to the LOCAL clipboard over SSH via OSC 52, rather than piping to a clipboard tool.
#
# NOT wl-copy or xclip: these are headless servers with no Wayland and no X. A
# `copy-pipe-and-cancel 'wl-copy'` binding fails silently on every one of them, and because a
# second `bind ... y` overrides the first, it takes working copy down with it.
#
# OSC 52 sends the selection to the TERMINAL, which puts it in Windows' clipboard. Requires
# the client to allow it - in SecureCRT check the terminal/emulation settings if it does not
# appear to work.
set -g set-clipboard on

# No delay after Escape - otherwise vim feels broken
set -sg escape-time 10

# Colours. REQUIRES the tmux-256color terminfo entry, which comes from the ncurses-term
# package. Without it tmux REFUSES TO START - "missing or unsuitable terminal". The Minimal
# cloud image does not ship it, so the install steps pull ncurses-term explicitly.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Reload with prefix + r
bind r source-file /etc/tmux.conf \; display "Reloaded /etc/tmux.conf"
