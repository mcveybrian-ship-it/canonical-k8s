# Serve the apt-mirror tree. THE CANONICAL COPY OF THIS FILE LIVES IN GIT.
#
# It ran for a week as an untracked file on stage-01, which the bundle copied verbatim - so
# the enclave's package-server config had no source of truth and no review. It is tracked now;
# edit it here, and `build-transfer-bundle.sh` carries this copy.
#
# Root is the mirror tree itself, so served paths mirror the upstream hostnames:
#   http://<host>/archive.ubuntu.com/ubuntu          noble / -updates / -security
#   http://<host>/esm.ubuntu.com/infra/ubuntu        noble-infra-security / -updates
#   http://<host>/esm.ubuntu.com/apps/ubuntu         noble-apps-security / -updates
#   http://<host>/esm.ubuntu.com/fips-updates/ubuntu noble-updates
#   http://<host>/esm.ubuntu.com/usg/ubuntu          noble
#
# Keys and the carried .debs sit OUTSIDE the mirror tree and get explicit aliases:
#   http://<host>/keys/    the five signing keyrings
#   http://<host>/debs/    contracts-airgapped, pro-airgapped, get-resource-tokens
#
# restore-mirror.sh rewrites the three paths below for the machine it runs on.
#
# NO AUTH HERE, deliberately. Inside the gap, entitlement is enforced by the contracts server
# on :8484, not by the repo. The bearer tokens exist only on stage-01, in mirror.list.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /srv/apt-mirror/mirror;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # apt asks for files that legitimately do not exist (by-hash, i18n variants, DEP-11 for
    # components we did not mirror). Keep 404s quiet but logged.
    #
    # These two lines also turned out to be the only reason a serving fault was ever
    # diagnosable: on 2026-09-03 three requests were answered by nginx's DEFAULT server block
    # during a reload window and landed in the default log, while six correct ones landed
    # here - same second, two files. Without split logs it read as a corrupt mirror.
    access_log /var/log/nginx/apt-mirror.access.log;
    error_log  /var/log/nginx/apt-mirror.error.log;

    # Serve .deb and index files as downloads, not as text the browser guesses at.
    location ~* \.(deb|udeb|tar\.(gz|xz|zst)|ddeb)$ {
        default_type application/vnd.debian.binary-package;
    }

    # ---------------------------------------------------------------------------------------
    # ^~ IS REQUIRED ON BOTH OF THESE, and its absence was a live fault until 2026-09-03.
    #
    # nginx matches REGEX locations before PREFIX locations. Written as plain `location
    # /debs/`, the `\.deb$` block above wins for /debs/*.deb and resolves it against the
    # SERVER ROOT instead of the alias. The symptom is precise and misleading:
    #
    #     /debs/                                    -> 200   (directory index, prefix match)
    #     /debs/contracts-airgapped_1.8.1_amd64.deb -> 404
    #
    # /keys/ appeared to work only because .gpg does not match that regex - so the fault hid
    # behind a half-working pair. ^~ tells nginx not to consider regex locations for a prefix.
    #
    # What it silently broke: the three .debs an in-gap machine cannot obtain any other way,
    # because it has no route to Launchpad. They were unreachable over HTTP on stage-01, in
    # the carried bundle, and on svc-repo-01.
    # ---------------------------------------------------------------------------------------

    # Signing keyrings the enclave needs to verify the ESM/FIPS/USG repos.
    location ^~ /keys/ {
        alias /srv/apt-mirror/keys/;
        autoindex on;
    }

    # Packages the mirror can never serve to an in-gap machine - it has no route to Launchpad.
    location ^~ /debs/ {
        alias /srv/apt-mirror/debs/;
        autoindex on;
        default_type application/vnd.debian.binary-package;
    }

    # Snaps, served the same way as /keys/ and /debs/. This is what replaces the Enterprise
    # Store: snapd installs a local file perfectly well, and `snap ack` still validates the
    # assertion chain, so nothing about integrity is weakened by not running a store.
    #
    # The .assert MUST travel with its .snap. Installing a snap whose assertion was never
    # acknowledged fails, and the error talks about the snap rather than the missing
    # assertion.
    location ^~ /snaps/ {
        alias /srv/repo/snaps/;
        autoindex on;
        autoindex_exact_size off;
        default_type application/octet-stream;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}

